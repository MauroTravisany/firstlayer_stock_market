contract_version: 1.0.0
data_contract_version: audit-contracts-v1
criticality: P0
environments:
- research
- shadow
point_in_time:
  eligibility: REGISTRY_ONLY
  reason: Registry metadata is not market input data.
table:
  name: audit_data_snapshots
  description: Publication registry for validated immutable data snapshots.
  granularity: One row per data_snapshot_id.
  logical_primary_key:
  - data_snapshot_id
  append_only: false
  partition_by: DATE(created_at)
  cluster_by:
  - environment
  - snapshot_status
  corporate_actions_policy: NOT_APPLICABLE
temporal:
  event_time: created_at
  available_at: created_at
  ingested_at: created_at
  timezone: UTC
  point_in_time_policy: Registry metadata is not market input data.
source:
  system: audit registry
  version_field: data_contract_version
  original_timezone: UTC
deduplication:
  rule: Reject duplicate logical key ['data_snapshot_id']; never silently overwrite audit lineage.
retention:
  policy: Retain indefinitely for audit and replay.
columns:
- name: data_snapshot_id
  type: STRING
  mode: REQUIRED
  description: Globally unique content-addressed snapshot identity.
- name: environment
  type: STRING
  mode: REQUIRED
  description: Environment that produced the snapshot.
  domain:
  - research
  - shadow
  - paper
  - staging
- name: data_contract_version
  type: STRING
  mode: REQUIRED
  description: Contract set version.
- name: contract_set_hash
  type: STRING
  mode: REQUIRED
  description: SHA-256 of canonical contract set.
- name: schema_snapshot_hash
  type: STRING
  mode: REQUIRED
  description: SHA-256 of canonical schemas.
- name: source_cutoff_at
  type: TIMESTAMP
  mode: REQUIRED
  description: Latest source timestamp represented by the immutable manifest.
- name: snapshot_status
  type: STRING
  mode: REQUIRED
  description: Snapshot lifecycle state.
  domain:
  - CREATED
  - VALIDATING
  - PUBLISHED
  - REJECTED
  - SUPERSEDED
- name: source_manifest_json
  type: STRING
  mode: REQUIRED
  description: Canonical source inventory JSON.
- name: source_manifest_hash
  type: STRING
  mode: REQUIRED
  description: SHA-256 of source manifest.
- name: content_checksum
  type: STRING
  mode: REQUIRED
  description: SHA-256 of canonical snapshot content.
- name: row_count
  type: INT64
  mode: NULLABLE
  description: Total represented rows when meaningful.
- name: quality_gate_json
  type: STRING
  mode: REQUIRED
  description: Canonical quality evidence JSON.
- name: quality_gate_status
  type: STRING
  mode: REQUIRED
  description: Aggregate quality gate state.
  domain:
  - PENDING
  - PASS
  - FAIL
  - PARTIAL
- name: immutable
  type: BOOL
  mode: REQUIRED
  description: True only after publication.
  domain:
  - true
- name: created_at
  type: TIMESTAMP
  mode: REQUIRED
  description: UTC creation timestamp.
- name: created_by
  type: STRING
  mode: REQUIRED
  description: Service or actor that built the snapshot manifest.
- name: production_change_allowed
  type: BOOL
  mode: REQUIRED
  description: Must remain false for research snapshots.
  domain:
  - false
- name: published_at
  type: TIMESTAMP
  mode: NULLABLE
  description: UTC publication timestamp.
- name: supersedes_snapshot_id
  type: STRING
  mode: NULLABLE
  description: Prior snapshot superseded by this row.
assertions:
  not_null:
  - data_snapshot_id
  - environment
  - data_contract_version
  - contract_set_hash
  - schema_snapshot_hash
  - source_cutoff_at
  - snapshot_status
  - source_manifest_json
  - source_manifest_hash
  - content_checksum
  - quality_gate_json
  - quality_gate_status
  - immutable
  - created_at
  - created_by
  - production_change_allowed
  unique:
  - - data_snapshot_id
  accepted_values:
    environment:
    - research
    - shadow
    - paper
    - staging
    snapshot_status:
    - CREATED
    - VALIDATING
    - PUBLISHED
    - REJECTED
    - SUPERSEDED
    quality_gate_status:
    - PENDING
    - PASS
    - FAIL
    - PARTIAL
    production_change_allowed:
    - false
implementation:
  mode: DATAFORM_CREATE
  dataform_definition: dataform/definitions/audit_data_snapshots.sqlx
producers:
- research/snapshot_manifest.py
- future authorized snapshot publisher
consumers:
- audit_experiment_runs
- research/replay.py
