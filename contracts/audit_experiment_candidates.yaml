contract_version: 1.0.0
data_contract_version: audit-contracts-v1
table:
  name: audit_experiment_candidates
  description: Candidate configurations isolated by experiment and run.
  granularity: One row per experiment_id, run_id and candidate_id.
  logical_primary_key:
  - experiment_id
  - run_id
  - candidate_id
  append_only: false
  partition_by: DATE(created_at)
  cluster_by:
  - experiment_id
  - run_id
  - candidate_status
  corporate_actions_policy: NOT_APPLICABLE
temporal:
  event_time: created_at
  available_at: created_at
  ingested_at: created_at
  timezone: UTC
  point_in_time_policy: Registry metadata is available from created_at; no market-data eligibility is
    implied.
source:
  system: strategy brain
  version_field: data_contract_version
  original_timezone: UTC
deduplication:
  rule: Reject duplicate experiment_id+run_id+candidate_id; candidate_id alone is never a join key.
retention:
  policy: Retain indefinitely for audit and replay.
columns:
- name: experiment_id
  type: STRING
  mode: REQUIRED
  description: Owning experiment identity.
- name: run_id
  type: STRING
  mode: REQUIRED
  description: Owning run identity.
- name: candidate_id
  type: STRING
  mode: REQUIRED
  description: SHA-256 identity derived from experiment, run and canonical configuration.
- name: generation
  type: INT64
  mode: REQUIRED
  description: Candidate generation, starting at one.
- name: hypothesis_index
  type: INT64
  mode: REQUIRED
  description: Ordinal within the run's hypothesis budget.
- name: parent_candidate_id
  type: STRING
  mode: NULLABLE
  description: Parent candidate identity.
- name: candidate_status
  type: STRING
  mode: REQUIRED
  description: Candidate lifecycle status.
  domain:
  - CREATED
  - RUNNING
  - COMPLETED
  - REJECTED
  - FAILED
- name: configuration_json
  type: STRING
  mode: REQUIRED
  description: Canonical candidate configuration.
- name: configuration_hash
  type: STRING
  mode: REQUIRED
  description: SHA-256 of configuration_json.
- name: production_change_allowed
  type: BOOL
  mode: REQUIRED
  description: Must remain false.
- name: created_at
  type: TIMESTAMP
  mode: REQUIRED
  description: UTC creation time.
- name: completed_at
  type: TIMESTAMP
  mode: NULLABLE
  description: UTC terminal time.
- name: result_checksum
  type: STRING
  mode: NULLABLE
  description: Canonical result checksum.
assertions:
  not_null:
  - experiment_id
  - run_id
  - candidate_id
  - generation
  - hypothesis_index
  - candidate_status
  - configuration_json
  - configuration_hash
  - production_change_allowed
  - created_at
  unique:
  - experiment_id
  - run_id
  - candidate_id
  accepted_values:
    candidate_status:
    - CREATED
    - RUNNING
    - COMPLETED
    - REJECTED
    - FAILED
producers:
- cloud-functions/strategy_brain/experiment_registry_adapter.py
consumers:
- Dataform candidate evaluation
- research/replay.py
- quant validation
