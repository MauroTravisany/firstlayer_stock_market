version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    groups:
      dashboard-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /dataform
    schedule:
      interval: weekly
      day: monday
    groups:
      dataform-dependencies:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: pip
    directory: /cloud-functions/daily_ai_analysis
    schedule:
      interval: weekly
      day: monday
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
