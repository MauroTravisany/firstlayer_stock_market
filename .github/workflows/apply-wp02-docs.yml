name: Apply WP-02 audit evidence

on:
  push:
    branches:
      - chatgpt/wp-02-data-contracts-experiment-registry
    paths:
      - .wp02-docs/ready

permissions:
  contents: write

concurrency:
  group: apply-wp02-docs
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WP-02 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/wp-02-data-contracts-experiment-registry
          fetch-depth: 0

      - name: Materialize audit evidence
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .wp02-docs/payload > /tmp/wp02-docs.tar.gz
          test "$(tar -tzf /tmp/wp02-docs.tar.gz | wc -l)" -eq 3
          tar -xzf /tmp/wp02-docs.tar.gz
          git diff --check
          rm -rf .wp02-docs
          git rm .github/workflows/apply-wp02-docs.yml

      - name: Commit final audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: record WP-02 CI evidence and replay runbook"
          git push origin HEAD:chatgpt/wp-02-data-contracts-experiment-registry
