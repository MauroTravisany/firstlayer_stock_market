name: WP-04 secure lock refresh

on:
  push:
    branches:
      - chatgpt/wp-04-canonical-prices-corporate-actions
    paths:
      - .github/workflows/wp04-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-dataform-lock:
    name: Refresh Dataform lock with vm2 3.11.6
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/wp-04-canonical-prices-corporate-actions
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Regenerate and verify secure lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd dataform
          npm pkg set 'overrides.vm2=3.11.6'
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          test "$(node -p "require('./node_modules/vm2/package.json').version")" = "3.11.6"
          npm audit --audit-level=critical
          npm exec -- dataform compile

      - name: Commit lock refresh and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wp04-lock-refresh.yml
          git config user.name "Mauro Travisany"
          git config user.email "103976344+MauroTravisany@users.noreply.github.com"
          git add dataform/package.json dataform/package-lock.json .github/workflows/wp04-lock-refresh.yml
          git diff --cached --check
          git commit -m "fix(dataform): override vm2 with patched 3.11.6"
          git push origin HEAD:chatgpt/wp-04-canonical-prices-corporate-actions
