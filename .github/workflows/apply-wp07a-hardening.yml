name: Apply WP-07A hardening payload

on:
  push:
    branches:
      - chatgpt/wp-07a-probabilistic-valuation

permissions:
  contents: write

concurrency:
  group: wp07a-hardening-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/wp-07a-probabilistic-valuation
          fetch-depth: 0

      - name: Reconstruct and verify reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          test -d .wp07a_payload
          cat .wp07a_payload/chunk_* | base64 --decode > /tmp/wp07a-hardening.tar.gz
          echo 'b675eb819fb34c8273f2d0237fb67d08634c4cdd2970c5c273b9004488923ef3  /tmp/wp07a-hardening.tar.gz' | sha256sum --check
          tar -xzf /tmp/wp07a-hardening.tar.gz -C .
          rm -f config/valuation/wp07a_policy_v1.json

      - name: Verify hardening before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements-ci.txt
          python -m compileall -q packages tests
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --check
          test -f config/valuation/wp07a_policy_v2.json
          test ! -e config/valuation/wp07a_policy_v1.json

      - name: Commit exact reviewed hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A packages/valuation tests/unit/valuation config/valuation docs/audit-grade/13_probabilistic_valuation_standard.md docs/audit-grade/evidence/WP-07A.md
          git diff --cached --quiet && { echo 'No hardening changes to commit'; exit 1; }
          git commit -m 'fix(wp07a): harden calibration lineage and probabilistic abstention'
          git push origin HEAD:chatgpt/wp-07a-probabilistic-valuation
