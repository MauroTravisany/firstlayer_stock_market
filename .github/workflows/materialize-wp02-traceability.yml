name: Materialize WP-02 traceability

on:
  push:
    branches:
      - chatgpt/wp-02-data-contracts-experiment-registry
    paths:
      - .matrix-staging/READY

permissions:
  contents: write

concurrency:
  group: materialize-wp02-traceability
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decode, verify and commit traceability matrix
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .matrix-staging -maxdepth 1 -name 'part-*.b64' -type f | wc -l)" -eq 5
          cat .matrix-staging/part-*.b64 | base64 --decode > docs/audit-grade/08_traceability_matrix.md
          echo 'ff49e30aa55d1116f5c6ecd44b32d2246c61c7a92d6c606d4f2aa69c85d82ccb  docs/audit-grade/08_traceability_matrix.md' | sha256sum --check
          test "$(wc -l < docs/audit-grade/08_traceability_matrix.md)" -eq 198
          rm -rf .matrix-staging
          rm .github/workflows/materialize-wp02-traceability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit-grade/08_traceability_matrix.md .matrix-staging .github/workflows/materialize-wp02-traceability.yml
          git diff --cached --check
          git commit -m 'docs: update WP-02 traceability matrix'
          git push origin "HEAD:${GITHUB_REF_NAME}"
