name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build immutable image (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: stockdaily
            context: cloud-functions/daily_stocks
          - service: stockfinancial
            context: cloud-functions/financial_data
          - service: stockmacrodata
            context: cloud-functions/macro_data
          - service: stockaianalysis
            context: cloud-functions/daily_ai_analysis
          - service: papertradingalerts
            context: cloud-functions/paper_trading_alerts
          - service: papertradeexecutor
            context: cloud-functions/paper_trade_executor
          - service: papertraderiskmonitor
            context: cloud-functions/paper_trade_risk_monitor
          - service: strategybrain
            context: cloud-functions/strategy_brain
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Build image once
        shell: bash
        run: |
          set -euo pipefail
          image="wp01/${{ matrix.service }}:${GITHUB_SHA}"
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}" \
            "${{ matrix.context }}"
          mkdir -p "release-artifacts/${{ matrix.service }}"
          docker save "${image}" | gzip -9 > "release-artifacts/${{ matrix.service }}/image.tar.gz"
          sha256sum "release-artifacts/${{ matrix.service }}/image.tar.gz" \
            > "release-artifacts/${{ matrix.service }}/image.tar.gz.sha256"
          jq -n \
            --arg service "${{ matrix.service }}" \
            --arg context "${{ matrix.context }}" \
            --arg git_sha "${GITHUB_SHA}" \
            --arg local_image "${image}" \
            --arg image_id "$(docker image inspect --format '{{.Id}}' "${image}")" \
            '{service:$service,context:$context,git_sha:$git_sha,local_image:$local_image,image_id:$image_id}' \
            > "release-artifacts/${{ matrix.service }}/metadata.json"

      - name: Upload immutable image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-run-image-${{ matrix.service }}-${{ github.sha }}
          path: release-artifacts/${{ matrix.service }}
          if-no-files-found: error
          retention-days: 7

  python-and-invariants:
    name: Python and repository invariants
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate repository invariants and secret patterns
        run: python scripts/ci/verify_repo_invariants.py

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          tools scripts tests cloud-functions

      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check changed lines for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin main
            git diff --check origin/main...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  workflow-contracts:
    name: Workflow syntax and contracts
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Validate workflow syntax with actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  dataform:
    name: Dataform compile
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dataform
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dataform/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Compile Dataform
        run: npm exec -- dataform compile

  dashboard:
    name: Dashboard build
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create deterministic dashboard inputs
        run: python scripts/ci/prepare_dashboard_fixtures.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dependencies
        working-directory: dashboard
        run: npm ci --legacy-peer-deps

      - name: Compile dashboard sources
        working-directory: dashboard
        run: npm run sources:strict

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build:strict

  terraform:
    name: Terraform validate
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  dependency-review:
    name: Dependency review
    needs: build-images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - build-images
      - python-and-invariants
      - workflow-contracts
      - dataform
      - dashboard
      - terraform
      - dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every verification surface
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = {name: value["result"] for name, value in json.loads(os.environ["NEEDS_JSON"]).items()}
          required = {
              "build-images",
              "python-and-invariants",
              "workflow-contracts",
              "dataform",
              "dashboard",
              "terraform",
          }
          failures = {name: results.get(name) for name in required if results.get(name) != "success"}
          dependency = results.get("dependency-review")
          if dependency not in {"success", "skipped"}:
              failures["dependency-review"] = dependency
          print(json.dumps({"status": "PASS" if not failures else "FAIL", "results": results}, sort_keys=True))
          if failures:
              sys.exit(1)
          PY
