name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contracts:
    name: Workflow syntax and immutable actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow syntax with actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color

      - name: Reject mutable action references
        run: python scripts/ci/verify_action_pinning.py

  python-and-invariants:
    name: Python, repository invariants and secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate repository invariants and secret patterns
        run: python scripts/ci/verify_repo_invariants.py

      - name: Validate additive Dataform expand contract
        run: >-
          python scripts/ci/verify_dataform_compatibility.py
          --previous dataform/contracts/wp01_previous.json
          --current dataform/contracts/runtime_compatibility.json
          --scan dataform/definitions

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          tools scripts tests cloud-functions

      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check changed lines for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin main
            git diff --check origin/main...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical

      - name: Record dependency review as not applicable
        if: github.event_name != 'pull_request'
        run: echo '{"status":"NOT_APPLICABLE_OUTSIDE_PULL_REQUEST"}'

  dependency-security:
    name: Critical npm audit gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Capture dashboard npm audit
        working-directory: dashboard
        shell: bash
        run: npm audit --json > ../dashboard-audit.json || test "$?" -eq 1

      - name: Enforce dashboard critical policy
        run: >-
          python scripts/ci/npm_audit_gate.py
          --audit-json dashboard-audit.json
          --package-lock dashboard/package-lock.json
          --allowlist .github/npm-audit-allowlist.json
          --surface dashboard

      - name: Capture Dataform npm audit
        working-directory: dataform
        shell: bash
        run: npm audit --json > ../dataform-audit.json || test "$?" -eq 1

      - name: Enforce Dataform critical policy
        run: >-
          python scripts/ci/npm_audit_gate.py
          --audit-json dataform-audit.json
          --package-lock dataform/package-lock.json
          --allowlist .github/npm-audit-allowlist.json
          --surface dataform

  preflight-gate:
    name: Security preflight gate
    if: always()
    needs:
      - workflow-contracts
      - python-and-invariants
      - dependency-review
      - dependency-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every lightweight and security check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = {name: value["result"] for name, value in json.loads(os.environ["NEEDS_JSON"]).items()}
          required = {"workflow-contracts", "python-and-invariants", "dependency-review", "dependency-security"}
          failures = {name: results.get(name) for name in required if results.get(name) != "success"}
          print(json.dumps({"status": "PASS" if not failures else "FAIL", "results": results}, sort_keys=True))
          if failures:
              sys.exit(1)
          PY

  build-images:
    name: Build immutable image (${{ matrix.service }})
    if: ${{ always() && needs.preflight-gate.result == 'success' }}
    needs:
      - preflight-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: stockdaily
            context: cloud-functions/daily_stocks
          - service: stockfinancial
            context: cloud-functions/financial_data
          - service: stockmacrodata
            context: cloud-functions/macro_data
          - service: stockaianalysis
            context: cloud-functions/daily_ai_analysis
          - service: papertradingalerts
            context: cloud-functions/paper_trading_alerts
          - service: papertradeexecutor
            context: cloud-functions/paper_trade_executor
          - service: papertraderiskmonitor
            context: cloud-functions/paper_trade_risk_monitor
          - service: strategybrain
            context: cloud-functions/strategy_brain
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image once
        shell: bash
        run: |
          set -euo pipefail
          image="wp01/${{ matrix.service }}:${GITHUB_SHA}"
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}" \
            "${{ matrix.context }}"
          mkdir -p "release-artifacts/${{ matrix.service }}"
          docker save "${image}" | gzip -9 > "release-artifacts/${{ matrix.service }}/image.tar.gz"
          sha256sum "release-artifacts/${{ matrix.service }}/image.tar.gz" \
            > "release-artifacts/${{ matrix.service }}/image.tar.gz.sha256"
          jq -n \
            --arg service "${{ matrix.service }}" \
            --arg context "${{ matrix.context }}" \
            --arg git_sha "${GITHUB_SHA}" \
            --arg local_image "${image}" \
            --arg image_id "$(docker image inspect --format '{{.Id}}' "${image}")" \
            '{service:$service,context:$context,git_sha:$git_sha,local_image:$local_image,image_id:$image_id}' \
            > "release-artifacts/${{ matrix.service }}/metadata.json"

      - name: Verify container liveness and non-mutating readiness
        run: >-
          python scripts/ci/integration_test_containers.py
          --image "wp01/${{ matrix.service }}:${GITHUB_SHA}"
          --service "${{ matrix.service }}"
          --timeout-seconds 45

      - name: Upload immutable image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-run-image-${{ matrix.service }}-${{ github.sha }}
          path: release-artifacts/${{ matrix.service }}
          if-no-files-found: error
          retention-days: 7

  dataform:
    name: Dataform compile
    if: ${{ always() && needs.preflight-gate.result == 'success' }}
    needs:
      - preflight-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dataform
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dataform/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Compile Dataform
        run: npm exec -- dataform compile

  dashboard:
    name: Dashboard build
    if: ${{ always() && needs.preflight-gate.result == 'success' }}
    needs:
      - preflight-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Create deterministic dashboard inputs
        run: python scripts/ci/prepare_dashboard_fixtures.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dependencies
        working-directory: dashboard
        run: npm ci --legacy-peer-deps

      - name: Compile dashboard sources
        working-directory: dashboard
        run: npm run sources:strict

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build:strict

  terraform:
    name: Terraform validate
    if: ${{ always() && needs.preflight-gate.result == 'success' }}
    needs:
      - preflight-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - preflight-gate
      - build-images
      - dataform
      - dashboard
      - terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every verification surface
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = {name: value["result"] for name, value in json.loads(os.environ["NEEDS_JSON"]).items()}
          required = {"preflight-gate", "build-images", "dataform", "dashboard", "terraform"}
          failures = {name: results.get(name) for name in required if results.get(name) != "success"}
          print(json.dumps({"status": "PASS" if not failures else "FAIL", "results": results}, sort_keys=True))
          if failures:
              sys.exit(1)
          PY
