              --uri "${SERVICE_URL}?execute=true" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}" \
              --message-body "{}" \
              --attempt-deadline 300s
          else
            gcloud scheduler jobs create http paper-trade-executor-intraday \
              --location us-east1 \
              --schedule "55 */4 * * 1-5" \
              --time-zone "America/Santiago" \
              --uri "${SERVICE_URL}?execute=true" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}" \
              --message-body "{}" \
              --attempt-deadline 300s
          fi

      - name: Deploy Alpaca paper risk monitor to Cloud Run
