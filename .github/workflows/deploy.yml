name: Deploy Cloud Run service

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy stock prices to Cloud Run
        run: |
          gcloud run deploy stockdaily \
              --source ./cloud-functions/daily_stocks \
              --platform managed \
              --region us-east1 \
              --no-allow-unauthenticated \
              --clear-base-image \
              --command python \
              --args main.py \
              --timeout 900 \
              --concurrency 1 \
              --max-instances 1 \
              --set-env-vars "PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},PORTFOLIO_TABLE_ID=portfolio_assets,DATA_QUALITY_TABLE_ID=pipeline_data_quality_daily,ALERT_WEBHOOK_TYPE=auto,TIME_ZONE=America/Santiago"

      - name: Configure stock prices intraday scheduler
        run: |
          SERVICE_URL="$(gcloud run services describe stockdaily --platform managed --region us-east1 --format='value(status.url)')"
          SERVICE_ACCOUNT="stock-alert-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          if gcloud scheduler jobs describe stockdaily-daily --location us-east1 >/dev/null 2>&1; then
            gcloud scheduler jobs update http stockdaily-daily \
              --location us-east1 \
              --schedule "0 */4 * * *" \
              --time-zone "America/Santiago" \
              --uri "${SERVICE_URL}?send_alert=false" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}/" \
              --message-body "{}" \
              --attempt-deadline 900s
          else
            gcloud scheduler jobs create http stockdaily-daily \
              --location us-east1 \
              --schedule "0 */4 * * *" \
              --time-zone "America/Santiago" \
              --uri "${SERVICE_URL}?send_alert=false" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}/" \
              --message-body "{}" \
              --attempt-deadline 900s
          fi

      - name: Deploy macro and news data to Cloud Run
        run: |
          gcloud run deploy stockmacrodata \
              --source ./cloud-functions/macro_data \
              --platform managed \
              --region us-east1 \
              --no-allow-unauthenticated \
              --clear-base-image \
              --command python \
              --args main.py \
              --timeout 300 \
              --concurrency 1 \
              --max-instances 1 \
              --set-env-vars "PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},MACRO_MARKET_TABLE_ID=macro_market_snapshot,MACRO_NEWS_TABLE_ID=macro_news_signal,MACRO_EARNINGS_TABLE_ID=macro_earnings_calendar,PORTFOLIO_TABLE_ID=portfolio_assets,TIME_ZONE=America/Santiago,GDELT_TIMESPAN=4H,GDELT_MAX_RECORDS=75"

      - name: Configure macro and news intraday scheduler
        run: |
          SERVICE_URL="$(gcloud run services describe stockmacrodata --platform managed --region us-east1 --format='value(status.url)')"
          SERVICE_ACCOUNT="stock-alert-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          gcloud run services add-iam-policy-binding stockmacrodata \
            --region us-east1 \
            --member "serviceAccount:${SERVICE_ACCOUNT}" \
            --role "roles/run.invoker" \
            --quiet
          if gcloud scheduler jobs describe stockmacrodata-intraday --location us-east1 >/dev/null 2>&1; then
            gcloud scheduler jobs update http stockmacrodata-intraday \
              --location us-east1 \
              --schedule "10 */4 * * *" \
              --time-zone "America/Santiago" \
              --uri "${SERVICE_URL}" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}" \
              --message-body "{}" \
              --attempt-deadline 300s
          else
            gcloud scheduler jobs create http stockmacrodata-intraday \
              --location us-east1 \
              --schedule "10 */4 * * *" \
              --time-zone "America/Santiago" \
              --uri "${SERVICE_URL}" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}" \
              --message-body "{}" \
              --attempt-deadline 300s
          fi

      - name: Deploy financial data to Cloud Run
        run: |
          gcloud run deploy stockfinancial \
              --source ./cloud-functions/financial_data \
              --platform managed \
              --region us-east1 \
              --no-allow-unauthenticated \
              --clear-base-image \
              --timeout 900 \
              --concurrency 1 \
              --max-instances 1 \
              --set-env-vars "PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},PORTFOLIO_TABLE_ID=portfolio_assets,PEER_UNIVERSE_TABLE_ID=peer_universe,DATA_QUALITY_TABLE_ID=pipeline_data_quality_daily,ALERT_WEBHOOK_TYPE=auto,TIME_ZONE=America/Santiago,FINANCIAL_STATEMENTS_TABLE_ID=financial_statements,FINANCIAL_RATIOS_TABLE_ID=financial_ratios_snapshot"

      - name: Deploy AI analysis to Cloud Run
        run: |
          gcloud run deploy stockaianalysis \
              --source ./cloud-functions/daily_ai_analysis \
              --platform managed \
              --region us-east1 \
              --no-allow-unauthenticated \
              --clear-base-image \
              --timeout 1800 \
              --memory 1Gi \
              --concurrency 1 \
              --max-instances 1 \
              --set-env-vars "PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},OPENAI_MODEL=gpt-5-mini,ALERT_WEBHOOK_TYPE=auto,PROMPT_VERSION=portfolio-ai-v7,AI_MAX_TICKERS=12,AI_ANALYSIS_TABLE_ID=portfolio_ai_analysis_daily,AI_SUMMARY_TABLE_ID=portfolio_ai_summary_daily,STATUS_CHANGES_TABLE_ID=portfolio_company_status_changes"

      - name: Deploy paper trading alerts to Cloud Run
        run: |
          gcloud run deploy papertradingalerts \
              --source ./cloud-functions/paper_trading_alerts \
              --platform managed \
              --region us-east1 \
              --no-allow-unauthenticated \
              --clear-base-image \
              --command python \
              --args main.py \
              --timeout 300 \
              --concurrency 1 \
              --max-instances 1 \
              --set-env-vars "PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},OPENAI_MODEL=gpt-5-mini,ALERT_WEBHOOK_TYPE=auto,TRADING_SUMMARY_TABLE_ID=trading_directional_daily_summary,TRADING_SIGNALS_TABLE_ID=trading_directional_signals,TRADING_RESULTS_TABLE_ID=trading_directional_trade_results,ALPACA_EXECUTIONS_TABLE_ID=trading_alpaca_paper_executions,TRADING_ALERTS_TABLE_ID=trading_alerts_sent,TRADING_FEEDBACK_TABLE_ID=trading_ai_feedback_daily,TRADING_WEEKLY_REVIEW_TABLE_ID=trading_weekly_ai_strategy_review,TRADING_AI_FEEDBACK=true,TRADING_PROMPT_VERSION=paper-trading-feedback-v2"

      - name: Deploy strategy brain in backtest-only mode
        run: |
          gcloud run deploy strategybrain \
              --source ./cloud-functions/strategy_brain \
              --platform managed \
              --region us-east1 \
              --no-allow-unauthenticated \
              --clear-base-image \
              --command python \
              --args main.py \
              --timeout 900 \
              --memory 1Gi \
              --concurrency 1 \
              --max-instances 1 \
              --set-env-vars "PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},OPENAI_MODEL=gpt-5-mini"

      - name: Configure strategy brain candidate scheduler
        run: |
          SERVICE_URL="$(gcloud run services describe strategybrain --platform managed --region us-east1 --format='value(status.url)')"
          SERVICE_ACCOUNT="stock-alert-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          gcloud run services add-iam-policy-binding strategybrain \
            --region us-east1 \
            --member "serviceAccount:${SERVICE_ACCOUNT}" \
            --role "roles/run.invoker" \
            --quiet
          if gcloud scheduler jobs describe strategy-brain-generate --location us-east1 >/dev/null 2>&1; then
            gcloud scheduler jobs update http strategy-brain-generate \
              --location us-east1 \
              --schedule "0 1 * * 6" \
              --time-zone "America/Santiago" \
              --uri "${SERVICE_URL}" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}" \
              --message-body '{"phase":"generate"}' \
              --attempt-deadline 900s
          else
            gcloud scheduler jobs create http strategy-brain-generate \
              --location us-east1 \
              --schedule "0 1 * * 6" \
              --time-zone "America/Santiago" \
              --uri "${SERVICE_URL}" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}" \
              --message-body '{"phase":"generate"}' \
              --attempt-deadline 900s
          fi

      - name: Configure strategy brain review scheduler
        run: |
          SERVICE_URL="$(gcloud run services describe strategybrain --platform managed --region us-east1 --format='value(status.url)')"
          SERVICE_ACCOUNT="stock-alert-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          if gcloud scheduler jobs describe strategy-brain-review --location us-east1 >/dev/null 2>&1; then
            gcloud scheduler jobs update http strategy-brain-review \
              --location us-east1 \
              --schedule "0 13 * * 0" \
              --time-zone "America/Santiago" \
              --uri "${SERVICE_URL}" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}" \
              --message-body '{"phase":"review"}' \
              --attempt-deadline 900s
          else
            gcloud scheduler jobs create http strategy-brain-review \
              --location us-east1 \
              --schedule "0 13 * * 0" \
              --time-zone "America/Santiago" \
              --uri "${SERVICE_URL}" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}" \
              --message-body '{"phase":"review"}' \
              --attempt-deadline 900s
          fi

      - name: Deploy Alpaca paper trade executor to Cloud Run
        run: |
          gcloud run deploy papertradeexecutor \
              --source ./cloud-functions/paper_trade_executor \
              --platform managed \
              --region us-east1 \
