              --concurrency 1 \
              --max-instances 1 \
              --set-env-vars "PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},PAPER_EXECUTION_MODE=paper,TRADING_SIGNALS_TABLE_ID=trading_directional_signals,TRADING_RESULTS_TABLE_ID=trading_directional_trade_results,ALPACA_EXECUTIONS_TABLE_ID=trading_alpaca_paper_executions,ALPACA_EQUITY_ORDER_CLASS=simple,ALPACA_ENABLE_CRYPTO_ORDERS=true,ALPACA_MAX_ORDERS_PER_RUN=3,ALPACA_MAX_ORDERS_PER_DAY=5,ALPACA_MAX_OPEN_POSITIONS=5,ALPACA_MAX_NOTIONAL_USD=10,ALPACA_MIN_SETUP_SCORE=0,ALPACA_REQUEST_TIMEOUT_SECONDS=20"

      - name: Configure Alpaca paper trade executor scheduler
        run: |
          SERVICE_URL="$(gcloud run services describe papertradeexecutor --platform managed --region us-east1 --format='value(status.url)')"
          SERVICE_ACCOUNT="stock-alert-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          gcloud run services add-iam-policy-binding papertradeexecutor \
            --region us-east1 \
            --member "serviceAccount:${SERVICE_ACCOUNT}" \
