name: Deploy Cloud Run service

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

env:
  REGION: us-east1
  ARTIFACT_REPOSITORY: cloud-run-source-deploy

jobs:
  build:
    name: Verify immutable CI artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download artifacts from the triggering CI run
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "${CI_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "cloud-run-image-*-${APPROVED_SHA}" \
            --dir release-artifacts

      - name: Verify artifact provenance and checksums
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${APPROVED_SHA}" = "$(git rev-parse HEAD)"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "${APPROVED_SHA}" = "${current_main}"
          python scripts/ci/verify_release_artifacts.py \
            --artifacts release-artifacts \
            --inventory scripts/ci/cloud_run_services.json \
            --approved-sha "${APPROVED_SHA}"
          mapfile -t metadata_files < <(find release-artifacts -name metadata.json -type f | sort)
          test "${#metadata_files[@]}" -eq 8
          for metadata in "${metadata_files[@]}"; do
            artifact_dir="$(dirname "${metadata}")"
            test "$(jq -r '.git_sha' "${metadata}")" = "${APPROVED_SHA}"
            (cd "${artifact_dir}" && sha256sum --check image.tar.gz.sha256)
          done
          echo "CI_ARTIFACTS_VERIFIED sha=${APPROVED_SHA} count=${#metadata_files[@]}"

  deploy:
    name: Approve, deploy, smoke and promote
    if: >-
      needs.build.result == 'success' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha != ''
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout approved release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the same verified CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "${CI_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "cloud-run-image-*-${APPROVED_SHA}" \
            --dir release-artifacts

      - name: Reverify artifact provenance before authentication
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${APPROVED_SHA}" = "$(git rev-parse HEAD)"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "${APPROVED_SHA}" = "${current_main}"
          python scripts/ci/verify_release_artifacts.py \
            --artifacts release-artifacts \
            --inventory scripts/ci/cloud_run_services.json \
            --approved-sha "${APPROVED_SHA}"

      - name: Authenticate to Google Cloud after approval
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify approved SHA and publish immutable digests
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "${APPROVED_SHA}" = "${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          : > approved-images.tsv
          : > release-manifest.ndjson
          mapfile -t metadata_files < <(find release-artifacts -name metadata.json -type f | sort)
          test "${#metadata_files[@]}" -eq 8
          for metadata in "${metadata_files[@]}"; do
            artifact_dir="$(dirname "${metadata}")"
            service="$(jq -r '.service' "${metadata}")"
            local_image="$(jq -r '.local_image' "${metadata}")"
            test "$(jq -r '.git_sha' "${metadata}")" = "${APPROVED_SHA}"
            (cd "${artifact_dir}" && sha256sum --check image.tar.gz.sha256)
            docker load --input "${artifact_dir}/image.tar.gz"
            remote_image="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${service}"
            docker tag "${local_image}" "${remote_image}:${APPROVED_SHA}"
            docker push "${remote_image}:${APPROVED_SHA}"
            digest="$(gcloud artifacts docker images describe "${remote_image}:${APPROVED_SHA}" --format='value(image_summary.digest)')"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            immutable_image="${remote_image}@${digest}"
            [[ "${immutable_image}" == *@sha256:* ]]
            printf '%s\t%s\n' "${service}" "${immutable_image}" >> approved-images.tsv
            jq -n \
              --arg service "${service}" \
              --arg git_sha "${APPROVED_SHA}" \
              --arg image_digest "${immutable_image}" \
              --arg environment "production" \
              '{service:$service,git_sha:$git_sha,image_digest:$image_digest,environment:$environment}' \
              >> release-manifest.ndjson
          done

      - name: Confirm Paper-only target configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for service in papertradeexecutor papertraderiskmonitor; do
            document="$(gcloud run services describe "${service}" --project "${GCP_PROJECT_ID}" --region "${REGION}" --platform managed --format=json)"
            mode="$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "PAPER_EXECUTION_MODE") | .value' <<<"${document}")"
            test "${mode}" = "paper"
            if [[ "${service}" == "papertradeexecutor" ]]; then
              echo "PAPER_EXECUTION_MODE=paper verified for papertradeexecutor"
            else
              echo "PAPER_EXECUTION_MODE=paper verified for papertraderiskmonitor"
            fi
          done

      - name: Stage, smoke, promote or rollback
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : > staged-revisions.tsv
          : > promoted-revisions.tsv

          rollback() {
            set +e
            if [[ -s promoted-revisions.tsv ]]; then
              tac promoted-revisions.tsv | while IFS=$'\t' read -r service previous_revision; do
                echo "ROLLBACK service=${service} revision=${previous_revision}"
                gcloud run services update-traffic "${service}" \
                  --project "${GCP_PROJECT_ID}" \
                  --region "${REGION}" \
                  --platform managed \
                  --to-revisions "${previous_revision}=100" \
                  --quiet
              done
            fi
          }
          trap 'status=$?; rollback; exit ${status}' ERR

          while IFS=$'\t' read -r service immutable_image; do
            [[ "${immutable_image}" == *@sha256:* ]]
            previous_revision="$(gcloud run services describe "${service}" \
              --project "${GCP_PROJECT_ID}" --region "${REGION}" --platform managed \
              --format='value(status.latestReadyRevisionName)')"
            test -n "${previous_revision}"
            gcloud run services update "${service}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${REGION}" \
              --platform managed \
              --image "${immutable_image}" \
              --no-traffic \
              --quiet
            staged_revision="$(gcloud run services describe "${service}" \
              --project "${GCP_PROJECT_ID}" --region "${REGION}" --platform managed \
              --format='value(status.latestCreatedRevisionName)')"
            test -n "${staged_revision}"
            python scripts/ci/smoke_test_services.py \
              --service "${service}" \
              --revision "${staged_revision}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${REGION}" \
              --expected-image "${immutable_image}" \
              --timeout-seconds 30
            printf '%s\t%s\t%s\t%s\n' \
              "${service}" "${previous_revision}" "${staged_revision}" "${immutable_image}" \
              >> staged-revisions.tsv
          done < approved-images.tsv

          while IFS=$'\t' read -r service previous_revision staged_revision immutable_image; do
            gcloud run services update-traffic "${service}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${REGION}" \
              --platform managed \
              --to-revisions "${staged_revision}=100" \
              --quiet
            printf '%s\t%s\n' "${service}" "${previous_revision}" >> promoted-revisions.tsv
            python scripts/ci/smoke_test_services.py \
              --service "${service}" \
              --revision "${staged_revision}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${REGION}" \
              --expected-image "${immutable_image}" \
              --timeout-seconds 30
          done < staged-revisions.tsv

          trap - ERR
          echo "PROMOTION_COMPLETE sha=${GITHUB_SHA}"

      - name: Record immutable release evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-run-release-${{ github.event.workflow_run.head_sha }}
          path: |
            release-manifest.ndjson
            staged-revisions.tsv
            promoted-revisions.tsv
          if-no-files-found: error
          retention-days: 90
