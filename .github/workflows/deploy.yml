              --schedule "*/30 * * * *" \
              --time-zone "UTC" \
              --uri "${SERVICE_URL}?execute=true&asset_scope=crypto" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}" \
              --message-body "{}" \
              --attempt-deadline 120s
          fi

      - name: Configure daily AI candidate scheduler
        run: |
          SERVICE_URL="$(gcloud run services describe stockaianalysis --platform managed --region us-east1 --format='value(status.url)')"
          SERVICE_ACCOUNT="stock-alert-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          if gcloud scheduler jobs describe stock-ai-analysis-daily --location us-east1 >/dev/null 2>&1; then
            gcloud scheduler jobs update http stock-ai-analysis-daily \
              --location us-east1 \
              --schedule "45 20 * * 1-5" \
              --time-zone "America/Santiago" \
              --uri "${SERVICE_URL}?analysis_scope=candidates&send_alert=true" \
              --http-method POST \
              --oidc-service-account-email "${SERVICE_ACCOUNT}" \
              --oidc-token-audience "${SERVICE_URL}/" \
              --message-body "{}" \
              --attempt-deadline 1800s
          else
